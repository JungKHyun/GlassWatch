directories:
  output: dist-v10
  buildResources: build
appId: com.pomodorocld.timer
productName: 집중해!
files:
  - filter:
      - main.js
      - preload.js
      - index.html
      - renderer.js
      - styles.css
win:
  target:
    - portable
  icon: ''
  signAndEditExecutable: false
  forceCodeSigning: false
portable:
  artifactName: 집중하기-${version}-portable.exe
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  artifactName: Pomodoro_cld-${version}-Setup.exe
electronVersion: 31.7.7
